<div class="berry-panel config-panel">
  <div class="berry-panel-title">Branch royalty rates</div>
  <p class="berry-panel-subtitle">
    Royalty can be edited differently for each branch.
  </p>

  <div class="rate-note">
    <mat-icon>info</mat-icon>
    Changing a branch rate affects future generations. Re-generating a month recomputes that branch's royalty at the new rate.
  </div>

  <div class="rate-list">
    <div class="rate-row" *ngFor="let row of rows; trackBy: trackByBranch">
      <div class="branch-name">{{ row.branchName }}</div>

      <mat-form-field appearance="outline" class="rate-field">
        <mat-label>Rate</mat-label>
        <input matInput type="number" [formControl]="row.control" min="0" max="100" step="0.5" />
        <span matTextSuffix>%</span>
        <mat-error *ngIf="row.control.hasError('required')">Rate is required.</mat-error>
        <mat-error *ngIf="row.control.hasError('min') || row.control.hasError('max')">
          Enter 0 to 100.
        </mat-error>
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        type="button"
        [disabled]="row.saving || row.control.invalid || row.control.pristine"
        (click)="saveRow(row)">
        <mat-icon>{{ row.saving ? 'hourglass_top' : 'save' }}</mat-icon>
        Save
      </button>
    </div>
  </div>
</div>
