spring.application.name=mw
server.port=8083
server.forward-headers-strategy=framework

# File uploads (logos, signatures, order images, payment vouchers)
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:25MB}

erpnext.base-url=${ERPNEXT_BASE_URL:http://localhost:8080}
erpnext.public-base-url=${ERPNEXT_PUBLIC_BASE_URL:${ERPNEXT_BASE_URL:http://localhost:8080}}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
erpnext.api-key=${ERPNEXT_API_KEY:}
erpnext.api-secret=${ERPNEXT_API_SECRET:}

# Sensitive values may be plain text temporarily or encrypted as ENC(...).
# When ENC(...) values are present, APP_CONFIG_MASTER_KEY must be set at runtime.
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:*}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security.web.util.matcher=TRACE
logging.level.org.springframework.security.authorization=TRACE
logging.level.org.springframework.security.web.access.intercept=TRACE

app.role.admin=${APP_ROLE_ADMIN:Administrator}
app.role.vendor=${APP_ROLE_VENDOR:Supplier}
app.role.shop=${APP_ROLE_SHOP:Customer}
app.role.helper=${APP_ROLE_HELPER:Stock User}
app.roles.helper-extra=${APP_ROLES_HELPER_EXTRA:Accounts User,Sales User}
app.roles.helper-extra=${APP_ROLES_HELPER_EXTRA:Accounts User,Sales User}

# Billing
app.billing.gst-template=${APP_BILLING_GST_TEMPLATE:}
app.order.margin.default-percent=${APP_ORDER_MARGIN_DEFAULT_PERCENT:7}

# Reporting (ERP Query Report runner)
app.reporting.allowed-report-names=${APP_REPORTING_ALLOWED_REPORT_NAMES:AAS - Sales Profit Summary,AAS - Branch Sales & Profit,AAS - Vendor Sales & Profit,AAS - Item Trend vs Baseline}
app.reporting.max-rows=${APP_REPORTING_MAX_ROWS:500}

# Default users (created via /api/setup/ensure)
app.defaults.enabled=${APP_DEFAULTS_ENABLED:true}
app.defaults.vendor.email=${APP_DEFAULTS_VENDOR_EMAIL:vendor@example.com}
app.defaults.vendor.name=${APP_DEFAULTS_VENDOR_NAME:Vendor User}
app.defaults.vendor.password=${APP_DEFAULTS_VENDOR_PASSWORD:}
app.defaults.vendor.supplier=${APP_DEFAULTS_VENDOR_SUPPLIER:FreshHarvest Agro Foods}
app.defaults.shop.email=${APP_DEFAULTS_SHOP_EMAIL:shop@example.com}
app.defaults.shop.name=${APP_DEFAULTS_SHOP_NAME:Shop User}
app.defaults.shop.password=${APP_DEFAULTS_SHOP_PASSWORD:}
app.defaults.shop.customer=${APP_DEFAULTS_SHOP_CUSTOMER:Sukarta Aundh}
app.defaults.helper.email=${APP_DEFAULTS_HELPER_EMAIL:helper@example.com}
app.defaults.helper.name=${APP_DEFAULTS_HELPER_NAME:Tapan User}
app.defaults.helper.password=${APP_DEFAULTS_HELPER_PASSWORD:}

# OCR (Tesseract)
ocr.tesseract.datapath=${OCR_TESSERACT_DATAPATH:}
ocr.tesseract.language=${OCR_TESSERACT_LANGUAGE:eng}
ocr.tesseract.dpi=${OCR_TESSERACT_DPI:300}

# PDF parser runtime
app.pdf.python-command=${APP_PDF_PYTHON_COMMAND:}
app.invoice-template-generator.enabled=${APP_INVOICE_TEMPLATE_GENERATOR_ENABLED:true}
app.invoice-template-generator.type=${APP_INVOICE_TEMPLATE_GENERATOR_TYPE:external_api}
app.invoice-template-generator.base-url=${APP_INVOICE_TEMPLATE_GENERATOR_BASE_URL:}
app.invoice-template-generator.model=${APP_INVOICE_TEMPLATE_GENERATOR_MODEL:}
app.invoice-template-generator.api-key=${APP_INVOICE_TEMPLATE_GENERATOR_API_KEY:}
app.invoice-template-generator.api-version=${APP_INVOICE_TEMPLATE_GENERATOR_API_VERSION:2023-06-01}
app.invoice-template-generator.debug-enabled=${APP_INVOICE_TEMPLATE_GENERATOR_DEBUG_ENABLED:false}
app.invoice-template-generator.feign-log-level=${APP_INVOICE_TEMPLATE_GENERATOR_FEIGN_LOG_LEVEL:BASIC}
app.invoice-template-generator.openrouter.site-url=${APP_INVOICE_TEMPLATE_GENERATOR_OPENROUTER_SITE_URL:http://localhost:4200}
app.invoice-template-generator.openrouter.title=${APP_INVOICE_TEMPLATE_GENERATOR_OPENROUTER_TITLE:AAS Ops Console}
app.invoice-delivery.email.sender=${APP_INVOICE_DELIVERY_EMAIL_SENDER:}
# Meta WhatsApp Cloud API Configuration
app.invoice-delivery.whatsapp.meta.access-token=${APP_INVOICE_DELIVERY_WHATSAPP_META_ACCESS_TOKEN:}
app.invoice-delivery.whatsapp.meta.phone-number-id=${APP_INVOICE_DELIVERY_WHATSAPP_META_PHONE_NUMBER_ID:}
app.invoice-delivery.whatsapp.meta.graph-api-version=${APP_INVOICE_DELIVERY_WHATSAPP_META_GRAPH_API_VERSION:v25.0}

# ERPNext setup defaults (used by erpmodule/create-site)
erp.setup.full-name=${ERP_SETUP_FULL_NAME:Administrator}
erp.setup.email=${ERP_SETUP_EMAIL:admin@example.com}
erp.setup.password=${ERP_SETUP_PASSWORD:}
erp.setup.company-name=${ERP_SETUP_COMPANY_NAME:AAS}
erp.setup.company-abbr=${ERP_SETUP_COMPANY_ABBR:AAS}
erp.setup.country=${ERP_SETUP_COUNTRY:United States}
erp.setup.currency=${ERP_SETUP_CURRENCY:INR}
erp.setup.timezone=${ERP_SETUP_TIMEZONE:America/New_York}
erp.setup.fy-start-date=${ERP_SETUP_FY_START_DATE:2026-01-01}
erp.setup.fy-end-date=${ERP_SETUP_FY_END_DATE:2026-12-31}
erp.setup.chart-of-accounts=${ERP_SETUP_CHART_OF_ACCOUNTS:Standard}
