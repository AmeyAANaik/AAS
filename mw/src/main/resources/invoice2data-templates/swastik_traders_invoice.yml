issuer: Swastik Traders
keywords:
  - SWASTIK TRADERS
  - Tax Invoice
  - GSTIN No 27ABKFS9441C1ZZ
fields:
  invoice_number:
    parser: regex
    regex: Invoice No\s*:\s*(\d+)
  date:
    parser: regex
    regex: Date\s*:\s*(\d{2}/\d{2}/\d{4})
    type: date
  amount:
    parser: regex
    regex: (?m)^\s*Bill Amount\s+(?!0\.00\b)([\d,]+\.\d{2})\s*$
    type: float
  amount_subtotal:
    parser: regex
    regex: (?m)^\s*Total\s+\d+(?:,\d{3})*(?:\.\d+)?\s+([\d,]+\.\d{2})\s*$
    type: float
lines:
  rules:
    - start: (?m)^Sr\.\s+Particulars\s+HSN Code\s+Qty\s+Tax\(%\)\s+Rate\s+Total Value\s*$
      end: (?m)^\s*Total\s+\d+(?:,\d{3})*(?:\.\d+)?\s+[\d,]+\.\d{2}\s*$
      first_line: ^\s*(?P<line_no>\d+)\s+(?P<description>.*?)\s{2,}(?P<item_id>\d{5,8})\s+(?P<qty>\d+(?:,\d{3})*(?:\.\d+)?)\s+(?P<gst>\d+(?:\.\d+)?)\s+(?P<rate>\d+(?:,\d{3})*(?:\.\d+)?)\s+(?P<amount>\d+(?:,\d{3})*(?:\.\d+)?)\s*$
      line: ^\s{2,}(?P<description>[A-Za-z0-9][A-Za-z0-9 &()[\].,'/-]*[A-Za-z0-9\]])\s*$
      skip_line:
        - '^\\s*After Tax\\s+After Tax\\s*$'
        - '^\\s*Tax\\s*$'
        - '^\\s*Taxable Value.*$'
        - '^\\s*\\(%\\)\\s*$'
        - '^\\s*Rounding Off.*$'
        - '^\\s*Bill Amount.*$'
        - '^\\s*In Words:.*$'
        - '^\\s*For SWASTIK TRADERS\\s*$'
        - '^\\s*PAN No .*$'
        - '^\\s*SWASTIK TRADERS\\s*$'
        - '^\\s*C54 , APMC MARKET 1 VASHI VASHI\\s*$'
        - '^\\s*GSTIN No 27ABKFS9441C1ZZ.*$'
        - '^\\s*Details of Receiver \\(Billed to\\)\\s*$'
        - '^\\s*M/s\\. SHREE SIDDHIVINAYAK FOODS.*$'
        - '^\\s*1ST FLOOR .*$'
        - '^\\s*BANER ROAD .*$'
        - '^\\s*PUNE\\s+Truck\\s*:?\\s*$'
        - '^\\s*State : Maharashtra.*$'
        - '^\\s*GSTIN No :\\..*$'
        - '^\\s*Broker\\s*: DIRECT\\s*$'
        - '^\\s*FSSAI No :\\..*$'
        - '^\\s*PAN NO\\s*$'
        - '^\\s*[\\d,]+\\.\\d{2}\\s*$'
      types:
        qty: float
        gst: float
        rate: float
        amount: float
options:
  currency: INR
  date_formats:
    - "%d/%m/%Y"
  decimal_separator: "."
