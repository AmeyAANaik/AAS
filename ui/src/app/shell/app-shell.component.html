<div class="shell">
  <header class="shell-header">
    <div class="header-left">
      <button class="nav-toggle" type="button" (click)="toggleNav()" aria-label="Toggle navigation menu">
        <span class="material-icons" aria-hidden="true">{{ isNavOpen ? 'close' : 'menu' }}</span>
      </button>
      <div class="header-brand">
        <img *ngIf="companyLogoUrl" class="header-logo-image" [src]="companyLogoUrl" [alt]="companyName + ' logo'" />
        <div *ngIf="!companyLogoUrl" class="header-logo" aria-hidden="true">{{ companyAvatarText }}</div>
        <div class="header-brand-copy">
          <div class="header-company">{{ companyName }}</div>
          <div class="header-company-sub">{{ companySubline }}</div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="user-menu-shell">
        <button class="header-chip user-chip" type="button" (click)="toggleUserMenu()" title="User menu">
          <span class="chip-avatar" aria-hidden="true">{{ userAvatarText }}</span>
          <span class="user-copy">
            <strong>{{ userName }}</strong>
            <small>{{ userRole || 'Signed in' }}</small>
          </span>
          <span class="material-icons" aria-hidden="true">expand_more</span>
        </button>
        <div class="user-menu-panel" *ngIf="isUserMenuOpen">
          <div class="user-panel-head">
            <div class="chip-avatar" aria-hidden="true">{{ userAvatarText }}</div>
            <div class="user-panel-copy">
              <strong>{{ userName }}</strong>
              <span *ngIf="userEmail">{{ userEmail }}</span>
              <span>{{ userRole || 'Signed in' }}</span>
            </div>
          </div>
          <a class="user-menu-link" routerLink="/company-settings" (click)="closeUserMenu()">
            <span class="material-icons" aria-hidden="true">business</span>
            Company Settings
          </a>
          <button class="user-menu-link danger" type="button" (click)="closeUserMenu(); logout()">
            <span class="material-icons" aria-hidden="true">logout</span>
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell-body">
    <div class="shell-sidebar-backdrop" *ngIf="isNavOpen" (click)="closeNav()"></div>
    <aside class="shell-sidebar" [class.shell-sidebar-open]="isNavOpen">
      <div class="sidebar-head">
        <div>
          <div class="sidebar-kicker">Workspace</div>
          <div class="sidebar-current">{{ breadcrumbs }}</div>
        </div>
      </div>

      <nav class="sidebar-group" *ngFor="let section of navSections">
        <div class="sidebar-title">{{ section.title }}</div>
        <a
          *ngFor="let link of section.links"
          [routerLink]="link.route"
          routerLinkActive="active"
          (click)="closeNav()">
          <span class="material-icons nav-icon" aria-hidden="true">{{ link.icon }}</span>
          {{ link.label }}
        </a>
      </nav>
    </aside>

    <main class="shell-content">
      <div class="breadcrumbs-shell">
        <div class="breadcrumbs">{{ breadcrumbs }}</div>
        <div class="breadcrumbs-note">Operational workspace</div>
      </div>
      <div class="page-body">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
